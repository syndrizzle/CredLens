# One-click Coolify deployment (Docker Compose build pack). Only `app` gets the domain (port 8000);
# `db` is reachable only on this resource's private network.
services:
  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@db:5432/credlens?sslmode=disable
      DATABASE_URL_UNPOOLED: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@db:5432/credlens?sslmode=disable
      CREDLENS_AI_URL: ${CREDLENS_AI_URL:?}
      CREDLENS_AI_TOKEN: ${CREDLENS_AI_TOKEN:?}
    volumes:
      - documents:/data/documents
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: credlens
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d credlens"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  documents:
  pgdata:
